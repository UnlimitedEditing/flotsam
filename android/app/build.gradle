apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release metadata comes from properties so CI can set it from the git tag (Phase 6):
//   ./gradlew assembleRelease -Pflotsam.versionCode=12 -Pflotsam.versionName=1.3.0
// flotsam.updateManifestUrl is where the app looks for version.json; empty disables the self-updater entirely.
def flotsamVersionCode = (project.findProperty('flotsam.versionCode') ?: '1').toInteger()
def flotsamVersionName = project.findProperty('flotsam.versionName') ?: '1.0.0'
def flotsamUpdateUrl = project.findProperty('flotsam.updateManifestUrl') ?: ''

// Release signing. The key never lives in the repository. Values come from the environment (CI) or from a
// properties file kept OUTSIDE the repo (-Pflotsam.keystoreProperties=<path>) with: storeFile, storePassword,
// keyAlias, keyPassword. If any is missing, a release build FAILS (see below); it never uses the debug key.
def keystoreProps = new Properties()
def keystorePropsPath = project.findProperty('flotsam.keystoreProperties')
if (keystorePropsPath && file(keystorePropsPath).exists()) {
    file(keystorePropsPath).withInputStream { keystoreProps.load(it) }
}
def signingValue = { String env, String prop -> System.getenv(env) ?: keystoreProps.getProperty(prop) }
def releaseStoreFile = signingValue('FLOTSAM_KEYSTORE_PATH', 'storeFile')
def releaseStorePassword = signingValue('FLOTSAM_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('FLOTSAM_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('FLOTSAM_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword &&
        file(releaseStoreFile).exists()

gradle.taskGraph.whenReady { graph ->
    def building = graph.allTasks.any { it.project == project && (it.name == 'assembleRelease' || it.name == 'packageRelease' || it.name == 'bundleRelease') }
    if (building && !hasReleaseSigning) {
        throw new GradleException(
            'Release signing is not configured, so no release APK was built (the debug key is never used for releases). ' +
            'Set FLOTSAM_KEYSTORE_PATH, FLOTSAM_KEYSTORE_PASSWORD, FLOTSAM_KEY_ALIAS and FLOTSAM_KEY_PASSWORD, ' +
            'or pass -Pflotsam.keystoreProperties=<file outside the repo>. See docs/release.md.')
    }
}

android {
    namespace = "app.flotsam.client"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.flotsam.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode flotsamVersionCode
        versionName flotsamVersionName
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${flotsamUpdateUrl}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    lint {
        // local.properties is machine-local (written by the SDK tooling, git-ignored); on Windows its drive-letter
        // path trips this check. Not a project file, so it must not fail the build.
        disable += 'PropertyEscape'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.work:work-runtime-ktx:2.10.2"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    testImplementation "org.json:json:20240303"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
